<style>

html,body{height:100%;margin:0;color:#fff;font-family:Calibri,Arial,sans-serif;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#22357d,#0b1233 75%)}

#top small{display:block;font-weight:400;opacity:.75;font-size:12px}
#hint{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));font-size:12px;opacity:.7;text-align:right;max-width:34vw;pointer-events:none}
#cap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--ui);padding:7px 16px;border-radius:999px;font-size:15px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:0 10px;overflow-x:auto;justify-content:safe center;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
button{font:600 13px Calibri,Arial,sans-serif;border:0;border-radius:999px;padding:9px 13px;background:var(--ui);color:#fff;cursor:pointer;white-space:nowrap;flex:none}
button.on,button.tour{background:var(--ac);color:#1A1F36}
.pin{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;padding:0;border-radius:50%;background:#142A6E;border:2px solid #fff;font:700 12px Arial,sans-serif;display:none;align-items:center;justify-content:center}
#info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));width:min(420px,92vw);background:var(--ui);border-radius:14px;padding:12px 16px;display:none;border:1px solid rgba(255,255,255,.15)}
#info b{font-size:16px;color:var(--ac)}#info p{margin:4px 0 0;font-size:14px;line-height:1.35}#info i{position:absolute;right:12px;top:8px;cursor:pointer;font-style:normal;opacity:.7}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px}

 const bx=(w,hh,d,c,y)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w*s,hh*s,d*s),mt(c));m.position.y=y*s;m.castShadow=true;return m};
 const body=new THREE.Group();body.position.y=.92*s;g.add(body);body.add(bx(.36,.5,.2,o.shirt,.27));
 const head=new THREE.Group();head.position.y=.64*s;body.add(head);
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.11*s,16,12),mt(o.skin));hd.castShadow=true;head.add(hd);
 const hr=new THREE.Mesh(new THREE.SphereGeometry(.118*s,16,12,0,Math.PI*2,0,Math.PI*.55),mt(o.hair));hr.position.set(0,.012*s,-.012*s);head.add(hr);
 [-1,1].forEach(e=>{const ey=new THREE.Mesh(new THREE.SphereGeometry(.014*s,6,6),mt(0x111111));ey.position.set(e*.04*s,.01*s,.1*s);head.add(ey)});
 const limb=(par,l1,l2,w,c1,c2,x,y,hand)=>{const a=new THREE.Group();a.position.set(x*s,y*s,0);a.add(bx(w,l1,w,c1,-l1/2));const b=new THREE.Group();b.position.y=-l1*s;a.add(b);b.add(bx(w*.9,l2,w*.9,c2,-l2/2));b.add(bx(w*.9,.07,w*1.1,hand,-l2-.03));par.add(a);return{a,b}};
 const aL=limb(body,.3,.28,.085,o.shirt,o.skin,-.23,.5,o.skin),aR=limb(body,.3,.28,.085,o.shirt,o.skin,.23,.5,o.skin),
  lL=limb(g,.44,.48,.13,o.pants,o.pants,-.09,.92,'#1b1b22'),lR=limb(g,.44,.48,.13,o.pants,o.pants,.09,.92,'#1b1b22');
 scene.add(g);
 return{g,body,head,aL,aR,lL,lR,rh:0,hd:0,sit(){body.position.y=lL.a.position.y=lR.a.position.y=.52*s;lL.a.rotation.x=lR.a.rotation.x=-Math.PI/2;lL.b.rotation.x=lR.b.rotation.x=Math.PI/2}}}

 H2=human({s:.9,shirt:0xe8590c,pants:0x1c2a5e,skin:0xc68642,hair:0x111111}),

const hp=[[2.98,8.2],[2.98,4.3],[-2.6,4.3],[-2.6,-.8],[-4.1,-.8]],hl=[];let HL=0;
for(let i=1;i<hp.length;i++){const d=Math.hypot(hp[i][0]-hp[i-1][0],hp[i][1]-hp[i-1][1]);hl.push(d);HL+=d}
const SPD=1.05,P1=4,P2=2,T1=HL/SPD,CY=2*T1+P1+P2;
function pathAt(d){let i=0;while(i<hl.length-1&&d>hl[i]){d-=hl[i];i++}const k=Math.min(d/hl[i],1),a=hp[i],b=hp[i+1];return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,Math.atan2(b[0]-a[0],b[1]-a[1])]}
function hum(t){
 const c=(t+3)%CY;let d=0,rev=false,pause=0;
 if(c<T1)d=c*SPD;else if(c<T1+P1){d=HL;pause=1}else if(c<2*T1+P1){d=HL-(c-T1-P1)*SPD;rev=true}else{d=0;pause=2}
 const p=pathAt(d),W=H1;let hd=p[2]+(rev?Math.PI:0);if(pause===1)hd=-Math.PI/2;if(pause===2)hd=Math.PI;
 let dh=hd-W.hd;dh=Math.atan2(Math.sin(dh),Math.cos(dh));W.hd+=dh*.12;
 const w=pause?0:Math.sin(d*5.5);
 W.g.position.set(p[0],Math.abs(w)*.025,p[1]);W.g.rotation.y=W.hd;
 W.lL.a.rotation.x=w*.6;W.lR.a.rotation.x=-w*.6;W.lL.b.rotation.x=Math.max(0,-w)*.7;W.lR.b.rotation.x=Math.max(0,w)*.7;
 W.aL.a.rotation.x=-w*.5;W.aR.a.rotation.x=w*.5;W.aL.b.rotation.x=W.aR.b.rotation.x=-.2;
 if(pause===1){W.aR.a.rotation.x=-1.5+.1*Math.sin(t*3);W.aL.a.rotation.x=0;W.head.rotation.y=.3*Math.sin(t*.8)}else W.head.rotation.y=0;
 [H2,H3].forEach((S,i)=>{const ph=i*1.7;S.aL.a.rotation.x=-1+.04*Math.sin(t*9+ph);S.aL.b.rotation.x=-.7+.06*Math.sin(t*11+ph);
  const up=i===1&&(t%9)>6.5&&(t%9)<8.5;S.rh+=((up?1:0)-S.rh)*.08;
  S.aR.a.rotation.x=-1-1.9*S.rh+.04*Math.sin(t*10+ph);S.aR.b.rotation.x=-.7+.6*S.rh;
  S.head.rotation.y=(i?.5:.25)*Math.sin(t*(.35+i*.1)+ph);S.head.rotation.x=.1})}

function stopTour(){tourOn=false;clearTimeout(tourT);tb.classList.remove('tour');tb.textContent='▶ Tur otomatis'}
function step(){if(!tourOn)return;go(tourI,4.5);tourT=setTimeout(()=>{tourI=(tourI+1)%views.length;step()},6200)}
